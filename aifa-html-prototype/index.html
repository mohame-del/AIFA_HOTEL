    <style>
      /* AIFA Standalone HTML Prototype Styles */
      @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap");
      :root {
        --bg: oklch(0.12 0 0);
        --sidebar: oklch(0.14 0 0);
        --card: oklch(0.19 0 0);
        --elevated: oklch(0.225 0 0);
        --fg: oklch(0.955 0.012 85);
        --muted: oklch(0.7 0.012 85);
        --primary: oklch(0.78 0.1 85);
        --primary-fg: oklch(0.15 0 0);
        --gold-soft: oklch(0.87 0.08 88);
        --border: oklch(0.3 0.008 85);
        --input: oklch(0.32 0.008 85);
        --ring: oklch(0.78 0.1 85);
        --status-available: oklch(0.93 0.015 85);
        --status-occupied: oklch(0.56 0.1 160);
        --status-reserved: oklch(0.72 0.14 70);
        --status-maintenance: oklch(0.56 0.16 25);
        --radius: 0.375rem;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        color-scheme: dark;
      }
      body {
        background:
          radial-gradient(ellipse at top, oklch(0.2 0.03 85 / 0.6), transparent 60%), var(--bg);
        color: var(--fg);
        font-family: "Manrope", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      .font-display {
        font-family: "Cormorant Garamond", serif;
        letter-spacing: 0.01em;
      }
      .field {
        width: 100%;
        height: 2.5rem;
        border-radius: var(--radius);
        border: 1px solid var(--input);
        background: var(--bg);
        color: var(--fg);
        padding: 0 0.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        height: 2.75rem;
        padding: 0 1.25rem;
        border-radius: var(--radius);
        font-weight: 600;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: linear-gradient(135deg, #e9d49b, #d6b66c 55%, oklch(0.62 0.09 75));
        color: var(--primary-fg);
        box-shadow: 0 10px 30px -12px color-mix(in oklab, var(--primary) 35%, transparent);
      }
      .btn-outline {
        background: transparent;
        border-color: var(--border);
        color: var(--fg);
      }
      .btn-ghost {
        background: transparent;
        color: var(--fg);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: calc(var(--radius)+2px);
      }
      .shadow {
        box-shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.8);
      }
      .text-muted {
        color: var(--muted);
      }
      .text-gold {
        background: linear-gradient(135deg, #e9d49b, #d6b66c 55%, oklch(0.62 0.09 75));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .dot {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 2px;
        display: inline-block;
      }
      .dot-available {
        background: var(--status-available);
      }
      .dot-occupied {
        background: var(--status-occupied);
      }
      .dot-reserved {
        background: var(--status-reserved);
      }
      .dot-maint {
        background: var(--status-maintenance);
      }
      .tile-available {
        background: var(--status-available);
        color: var(--primary-fg);
        border-color: var(--status-available);
      }
      .tile-occupied {
        background: var(--status-occupied);
        color: var(--fg);
        border-color: var(--status-occupied);
      }
      .tile-reserved {
        background: var(--status-reserved);
        color: var(--primary-fg);
        border-color: var(--status-reserved);
      }
      .tile-maint {
        background: var(--status-maintenance);
        color: var(--fg);
        border-color: var(--status-maintenance);
      }
      .toast {
        position: fixed;
        top: 1rem;
        right: 1rem;
        background: var(--card);
        border: 1px solid var(--border);
        padding: 0.75rem 1rem;
        border-radius: var(--radius);
        opacity: 0;
        transition: 0.2s;
        z-index: 50;
      }
      .toast.show {
        opacity: 1;
      }
      .badge {
        display: inline-flex;
        gap: 0.375rem;
        align-items: center;
        border: 1px solid var(--border);
        background: var(--elevated);
        padding: 0 0.5rem;
        height: 1.5rem;
        border-radius: var(--radius);
        font-size: 0.75rem;
      }
      .nav {
        padding: 0.625rem 0.875rem;
        border-radius: var(--radius);
        color: var(--muted);
        text-decoration: none;
        font-size: 0.875rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .nav:hover {
        background: var(--elevated);
        color: var(--fg);
      }
      .nav.active {
        background: var(--elevated);
        color: var(--fg);
      }
      .room-btn {
        cursor: pointer;
        font-family: Cormorant Garamond;
        font-size: 0.875rem;
      }
      .room-link {
        cursor: pointer;
      }
    </style>
  </head>

            number: n,
            type: t.type,
            capacity: t.capacity,
            rate: t.rate,
            status: "available",

              roomNumber: n,

        }
        return (
          '<div class="card"><div style="padding:1rem"><h2 style="font-size:1.25rem;font-family:Cormorant Garamond">Guest Feedback</h2></div><div style="overflow-x:auto"><table style="width:100%;font-size:.875rem"><thead><tr style="text-align:left;color:var(--muted);text-transform:uppercase;font-size:.75rem"><th style="padding:.75rem;border-bottom:1px solid var(--border)">ID</th><th style="padding:.75rem;border-bottom:1px solid var(--border)">Category</th><th style="padding:.75rem;border-bottom:1px solid var(--border)">Room</th><th style="padding:.75rem;border-bottom:1px solid var(--border)">Date</th><th style="padding:.75rem;border-bottom:1px solid var(--border)">Status</th></tr></thead><tbody>' +
          rows +
          "</tbody></table></div></div>"
        );
      }
      function renderSupervisor() {
        const c = roomCounts();
        const occ = Math.round((c.occupied / 90) * 100);
        return (
          '<div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem">' +
          '<div class="card" style="padding:1rem"><div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.15em">Total rooms</div><div style="font-size:2rem;font-family:Cormorant Garamond">90</div></div>' +
          '<div class="card" style="padding:1rem"><div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.15em">Occupancy</div><div style="font-size:2rem;font-family:Cormorant Garamond">' +
          occ +
          "%</div></div>" +
          '<div class="card" style="padding:1rem"><div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.15em">In-house guests</div><div style="font-size:2rem;font-family:Cormorant Garamond">' +
          c.occupied +
          "</div></div>" +
          '<div class="card" style="padding:1rem"><div class="text-muted" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.15em">Avg. rating</div><div style="font-size:2rem;font-family:Cormorant Garamond">4.0</div></div>' +
          '</div><div class="card" style="margin-top:1rem;padding:1rem"><p class="text-muted">Demo supervisor view - financial figures are demonstration data only.</p></div></div>'
        );
      }
      function renderSettings() {
        const role = state.role;
        return (
          '<div class="card" style="padding:1rem;max-width:40rem"><h2 style="font-size:1.25rem;font-family:Cormorant Garamond">Settings</h2><p class="text-muted" style="margin-top:.5rem">Current role: ' +
          (role === "supervisor" ? "Supervisor" : "Receptionist") +
          '</p><div style="margin-top:1rem;display:flex;gap:.5rem"><button class="btn btn-outline" data-set-role="receptionist">Receptionist</button><button class="btn btn-outline" data-set-role="supervisor">Supervisor</button><button class="btn btn-outline" data-set-reset>Reset demo</button></div></div>'
        );
      }
      function attachStaff() {
        document.querySelectorAll("[data-nav]").forEach((a) =>
          a.addEventListener("click", (e) => {
            e.preventDefault();
            const v = a.dataset.nav;
            if (v === "overview") state.ui.view = "staff";
            if (v === "rooms") state.ui.view = "rooms";
            if (v === "reservations") state.ui.view = "reservations";
            if (v === "feedback") state.ui.view = "feedback";
            if (v === "supervisor") state.ui.view = "staff-supervisor";
            if (v === "settings") state.ui.view = "settings";
            render();
          }),
        );
        document.querySelectorAll(".room-btn").forEach((b) =>
          b.addEventListener("click", (e) => {
            e.preventDefault();
            alert(
              "Room " + b.dataset.room + " details - full dialog in Next.js replica. Demo mode.",
            );
          }),
        );
        document.querySelectorAll(".room-link").forEach((b) =>
          b.addEventListener("click", (e) => {
            e.preventDefault();
            alert("Room " + b.dataset.room + " details");
          }),
        );
        const og = document.querySelector("[data-open-guest]");
        if (og)
          og.addEventListener("click", (e) => {
            e.preventDefault();
            state.ui.view = "guest";
            render();
          });
        const lg = document.querySelector("[data-logout]");
        if (lg)
          lg.addEventListener("click", (e) => {
            e.preventDefault();
            state.role = null;
            state.ui.view = "login";
            render();
          });
        const rs = document.querySelector("[data-reset]");
        if (rs)
          rs.addEventListener("click", (e) => {
            e.preventDefault();
            const prev = state;
            state = createSeed();
            state.role = prev.role;
            state.ui.view =
              prev.role === "supervisor" ? "staff-supervisor" : prev.role ? "staff" : "login";
            render();
            toast("Demo data restored");
          });
        document.querySelectorAll("[data-set-role]").forEach((b) =>
          b.addEventListener("click", (e) => {
            state.role = b.dataset.setRole;
            if (state.role === "supervisor") state.ui.view = "staff-supervisor";
            else state.ui.view = "staff";
            render();
          }),
        );
        const sr = document.querySelector("[data-set-reset]");
        if (sr)
          sr.addEventListener("click", (e) => {
            e.preventDefault();
            const prev = state;
            state = createSeed();
            state.role = prev.role;
            state.ui.view =
              prev.role === "supervisor" ? "staff-supervisor" : prev.role ? "staff" : "login";
            render();
            toast("Demo data restored");
          });
      }
      function init() {
        state = createSeed();
        render();
      }
      init();
    </script>
  </body>
</html>
